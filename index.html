<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static's Hooper Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 800px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff6b35, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffd166;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #ddd;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      background: #1e3a8a;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      min-width: 180px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-save {
      background: #6d28d9;
    }

    .btn-save.selected {
      background: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    .btn-highschool {
      background: #e67e22;
    }

    .btn-college {
      background: #2980b9;
    }

    .btn-back {
      background: #555;
      margin-top: 20px;
      min-width: auto;
      padding: 10px 20px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none;
    }

    .path-options {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .selected-save-info {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
      color: #ffd166;
    }
  </style>
</head>
<body>

  <!-- MAIN MENU SCREEN -->
  <div id="main-menu" class="screen active">
    <h1>Static's Hooper Generator</h1>
    <p>Choose a save file to begin your basketball journey</p>

    <div class="button-group">
      <button class="btn btn-save" data-save="1">Save 1</button>
      <button class="btn btn-save" data-save="2">Save 2</button>
      <button class="btn btn-save" data-save="3">Save 3</button>
    </div>

    <div id="selected-save-info" class="selected-save-info hidden"></div>

    <div id="path-options" class="path-options hidden">
      <h2>Choose Your Starting Path</h2>
      <div class="button-group">
        <button class="btn btn-highschool" id="start-highschool">High School</button>
        <button class="btn btn-college" id="start-college">College</button>
      </div>
    </div>
  </div>

  <!-- CHARACTER CREATION PLACEHOLDER -->
  <div id="character-creation" class="screen">
    <h2>Character Creation</h2>
    <p>This screen is under construction.</p>
    <button class="btn btn-back" id="back-to-menu">Back to Main Menu</button>
  </div>

  <script>
    // ---------- GAME STATE ----------
    const state = {
      currentSaveSlot: null,   // 1, 2, or 3
      currentPath: null,       // 'highschool' or 'college'
      player: null             // will hold character data later
    };

    // ---------- DOM ELEMENTS ----------
    const mainMenuScreen = document.getElementById('main-menu');
    const characterCreationScreen = document.getElementById('character-creation');
    const saveButtons = document.querySelectorAll('.btn-save');
    const selectedSaveInfo = document.getElementById('selected-save-info');
    const pathOptions = document.getElementById('path-options');
    const startHighschoolBtn = document.getElementById('start-highschool');
    const startCollegeBtn = document.getElementById('start-college');
    const backToMenuBtn = document.getElementById('back-to-menu');

    // ---------- SCREEN NAVIGATION ----------
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    // ---------- SAVE FILE SELECTION ----------
    saveButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        // Update selected save slot
        state.currentSaveSlot = parseInt(this.dataset.save);
        
        // Highlight selected save button
        saveButtons.forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        
        // Show selected info and path options
        selectedSaveInfo.textContent = `Selected Save File: ${state.currentSaveSlot}`;
        selectedSaveInfo.classList.remove('hidden');
        pathOptions.classList.remove('hidden');
      });
    });

    // ---------- START PATH SELECTION ----------
    startHighschoolBtn.addEventListener('click', function() {
      state.currentPath = 'highschool';
      proceedToCharacterCreation();
    });

    startCollegeBtn.addEventListener('click', function() {
      state.currentPath = 'college';
      proceedToCharacterCreation();
    });

    function proceedToCharacterCreation() {
      if (!state.currentSaveSlot) {
        alert('Please choose a save file first.');
        return;
      }
      // Move to character creation screen (placeholder)
      showScreen('character-creation');
      // We could log state for debugging
      console.log('Starting path:', state.currentPath, 'Save slot:', state.currentSaveSlot);
    }

    // ---------- BACK BUTTON ----------
    backToMenuBtn.addEventListener('click', function() {
      showScreen('main-menu');
    });

    // Initialize: no save selected
    console.log('Game initialized. Waiting for save file selection...');
  </script>
</body>
</html>
