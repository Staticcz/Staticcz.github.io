<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Life · Simulator</title>
    <style>
        /* ---------- GLOBAL STYLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1d2f44 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            width: 100%;
            max-width: 820px;
            height: 90vh;
            max-height: 880px;
            background: rgba(18, 28, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ---------- APP HEADER ---------- */
        .app-header {
            padding: 18px 22px;
            background: rgba(10, 20, 30, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #cfd9e6, #9bb8da);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-header h1 span {
            font-size: 0.8rem;
            background: #2e4b6b;
            padding: 4px 10px;
            border-radius: 30px;
            color: #bdd3ea;
            font-weight: 400;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #bdd3ea;
        }

        .new-life-btn {
            background: rgba(220, 70, 70, 0.15);
            border: 1px solid rgba(220, 70, 70, 0.5);
            color: #f7baba;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .new-life-btn:hover {
            background: rgba(220, 70, 70, 0.3);
            border-color: #e06e6e;
            color: #ffe0e0;
        }

        /* ---------- MAIN SCREEN (NAV + CONTENT) ---------- */
        .main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- NAVIGATION ---------- */
        .nav-tabs {
            display: flex;
            padding: 12px 18px 0 18px;
            gap: 8px;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #8ba1bb;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.2px;
            position: relative;
            top: 1px;
        }

        .nav-btn:hover {
            color: #cbdae9;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-btn.active {
            color: #ffffff;
            background: rgba(60, 100, 140, 0.3);
            border-bottom: 2px solid #4f8bc9;
        }

        /* ---------- CONTENT AREA (scrollable) ---------- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 22px 22px 30px 22px;
            scrollbar-width: thin;
            scrollbar-color: #3e5a78 #1a2635;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: #1a2635;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: #3e5a78;
            border-radius: 10px;
        }

        /* ---------- PANELS / CARDS ---------- */
        .panel {
            background: rgba(20, 32, 48, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 22px 22px;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 500;
            color: #e2ecf7;
            letter-spacing: -0.2px;
        }

        .age-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: #9ac7ff;
            text-shadow: 0 2px 10px rgba(100, 160, 255, 0.3);
        }

        .life-stage-badge {
            background: #1d3f5e;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #c0dcff;
            border: 1px solid #2d5477;
        }

        /* ---------- CHARACTER SUMMARY (home) ---------- */
        .char-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            margin: 16px 0 10px;
            color: #b7c9dd;
        }

        .char-summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .char-summary-item strong {
            color: #e5eff9;
            font-weight: 500;
        }

        .label-icon {
            opacity: 0.7;
            font-size: 1.1rem;
        }

        /* ---------- BUTTONS ---------- */
        .primary-btn {
            background: linear-gradient(145deg, #2c5f8a, #1e4466);
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 60, 120, 0.4);
            transition: all 0.15s ease;
            border: 1px solid rgba(100, 180, 255, 0.3);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .primary-btn:hover {
            background: linear-gradient(145deg, #3878aa, #245b88);
            box-shadow: 0 12px 28px rgba(0, 100, 200, 0.5);
            transform: scale(1.01);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #3e6180;
            color: #b8d1ea;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .secondary-btn:hover {
            background: rgba(70, 110, 150, 0.2);
            border-color: #5b8bb0;
            color: white;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        /* ---------- PROFILE GRID ---------- */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .profile-field {
            background: rgba(10, 22, 34, 0.6);
            border-radius: 1rem;
            padding: 14px 16px;
            border: 1px solid rgba(80, 130, 180, 0.15);
        }

        .profile-field .field-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #6e8aa8;
            margin-bottom: 6px;
        }

        .profile-field .field-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e2ecf7;
            word-break: break-word;
        }

        /* ---------- TIMELINE (life history) ---------- */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .timeline-entry {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: rgba(10, 22, 34, 0.5);
            border-radius: 1rem;
            padding: 14px 18px;
            border-left: 3px solid #3b7bb3;
            transition: background 0.15s;
            animation: fadeSlideIn 0.3s ease;
        }

        .timeline-entry:hover {
            background: rgba(25, 45, 65, 0.7);
        }

        .timeline-age {
            font-weight: 700;
            color: #8bb9e8;
            font-size: 1.1rem;
            min-width: 45px;
            letter-spacing: -0.2px;
        }

        .timeline-text {
            color: #ccdef0;
            font-size: 0.98rem;
            line-height: 1.4;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- CREATE CHARACTER SCREEN ---------- */
        .create-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .create-card {
            background: rgba(18, 30, 44, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 30px 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(70, 130, 190, 0.2);
        }

        .create-card h2 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #e5eff9;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8faec9;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 20, 30, 0.8);
            border: 1px solid #2c4056;
            border-radius: 40px;
            font-size: 1rem;
            color: #eef5fc;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4f8bc9;
            box-shadow: 0 0 0 3px rgba(79, 139, 201, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-actions {
            margin-top: 26px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .error-msg {
            color: #f7a6a6;
            font-size: 0.8rem;
            margin-top: 6px;
            min-height: 18px;
        }

        /* ---------- HIDDEN / UTILITY ---------- */
        .hidden {
            display: none !important;
        }

        .text-muted {
            color: #849eb8;
            font-size: 0.9rem;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            .game-container {
                height: 96vh;
                border-radius: 1.5rem;
            }

            .app-header {
                padding: 12px 16px;
            }

            .app-header h1 {
                font-size: 1.3rem;
            }

            .new-life-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .nav-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            .content-area {
                padding: 16px;
            }

            .panel {
                padding: 16px;
            }

            .age-display {
                font-size: 1.4rem;
            }

            .profile-grid {
                grid-template-columns: 1fr 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <!-- ========== HEADER ========== -->
        <header class="app-header">
            <h1>LIFE <span>simulator</span></h1>
            <button class="new-life-btn" id="newLifeBtn">↻ New Life</button>
        </header>

        <!-- ========== MAIN SCREEN (character exists) ========== -->
        <div class="main-screen" id="mainScreen">
            <!-- Navigation tabs -->
            <div class="nav-tabs">
                <button class="nav-btn active" data-tab="home">Home</button>
                <button class="nav-btn" data-tab="profile">Profile</button>
                <button class="nav-btn" data-tab="history">Life History</button>
            </div>

            <!-- Dynamic content area -->
            <div class="content-area" id="contentArea">
                <!-- rendered by JS -->
            </div>
        </div>

        <!-- ========== CREATE CHARACTER SCREEN ========== -->
        <div class="create-screen" id="createScreen">
            <div class="create-card">
                <h2>Create your character</h2>
                <form id="createForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First name</label>
                            <input type="text" id="firstName" placeholder="e.g. Alex" maxlength="30" required>
                        </div>
                        <div class="form-group">
                            <label>Last name</label>
                            <input type="text" id="lastName" placeholder="e.g. Rivera" maxlength="30" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="">Select gender</option>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                            <option value="Non-binary">Non-binary</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Country of birth</label>
                            <input type="text" id="country" placeholder="e.g. Canada" maxlength="40" required>
                        </div>
                        <div class="form-group">
                            <label>City of birth</label>
                            <input type="text" id="city" placeholder="e.g. Toronto" maxlength="40" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Date of birth</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="error-msg" id="formError"></div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn" style="padding: 12px 28px;">Begin Life →</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. GAME STATE & CONFIGURATION
            // ============================================================
            const STORAGE_KEY = 'life_simulator_character_v1';
            let character = null;          // holds current character data
            let activeTab = 'home';        // current navigation tab

            // Life stages thresholds (inclusive lower bound)
            const LIFE_STAGES = [
                { name: 'Baby', minAge: 0, maxAge: 2 },
                { name: 'Toddler', minAge: 3, maxAge: 4 },
                { name: 'Child', minAge: 5, maxAge: 12 },
                { name: 'Teenager', minAge: 13, maxAge: 17 },
                { name: 'Young Adult', minAge: 18, maxAge: 24 },
                { name: 'Adult', minAge: 25, maxAge: 44 },
                { name: 'Middle-Aged Adult', minAge: 45, maxAge: 64 },
                { name: 'Senior', minAge: 65, maxAge: 89 },
                { name: 'Elderly', minAge: 90, maxAge: Infinity }
            ];

            // DOM references
            const mainScreen = document.getElementById('mainScreen');
            const createScreen = document.getElementById('createScreen');
            const contentArea = document.getElementById('contentArea');
            const navBtns = document.querySelectorAll('.nav-btn');
            const newLifeBtn = document.getElementById('newLifeBtn');
            const createForm = document.getElementById('createForm');
            const formError = document.getElementById('formError');

            // ============================================================
            // 2. UTILITY FUNCTIONS
            // ============================================================

            /** Get life stage name based on age */
            function getLifeStage(age) {
                for (let stage of LIFE_STAGES) {
                    if (age >= stage.minAge && age <= stage.maxAge) return stage.name;
                }
                return 'Elderly'; // fallback
            }

            /** Generate a friendly birthday string from stored date */
            function formatBirthday(dateStr) {
                if (!dateStr) return '—';
                const d = new Date(dateStr + 'T00:00:00');
                if (isNaN(d)) return dateStr;
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            /** Return the full name */
            function fullName(char) {
                return `${char.firstName} ${char.lastName}`.trim() || 'Unnamed';
            }

            /** Generate timeline entry text based on age and name */
            function getTimelineText(age, firstName) {
                if (age === 0) return 'Your life begins!';
                if (age === 1) return `You celebrated your first birthday!`;
                if (age === 2) return `You turned 2 years old!`;
                return `You turned ${age} years old!`;
            }

            /** Build a timeline entry object for a given age */
            function createTimelineEntry(age, firstName) {
                return {
                    age: age,
                    text: getTimelineText(age, firstName)
                };
            }

            // ============================================================
            // 3. STORAGE (localStorage)
            // ============================================================

            function saveCharacter() {
                if (character) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(character));
                }
            }

            function loadCharacter() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return null;
                try {
                    const parsed = JSON.parse(stored);
                    // basic validation
                    if (parsed && parsed.firstName && parsed.lastName && typeof parsed.age === 'number') {
                        return parsed;
                    }
                } catch (e) { /* ignore corrupt data */ }
                return null;
            }

            function clearCharacter() {
                localStorage.removeItem(STORAGE_KEY);
                character = null;
            }

            // ============================================================
            // 4. CHARACTER CREATION
            // ============================================================

            function createNewCharacter(data) {
                const newChar = {
                    firstName: data.firstName.trim(),
                    lastName: data.lastName.trim(),
                    gender: data.gender,
                    country: data.country.trim(),
                    city: data.city.trim(),
                    dob: data.dob,                    // ISO string YYYY-MM-DD
                    age: 0,
                    lifeStage: getLifeStage(0),
                    timeline: [ createTimelineEntry(0, data.firstName.trim()) ]
                };
                return newChar;
            }

            // ============================================================
            // 5. RENDER FUNCTIONS (UI)
            // ============================================================

            /** Show main game screen (when character exists) */
            function showMainScreen() {
                mainScreen.classList.remove('hidden');
                createScreen.classList.add('hidden');
            }

            /** Show create character screen */
            function showCreateScreen() {
                mainScreen.classList.add('hidden');
                createScreen.classList.remove('hidden');
                // reset form
                createForm.reset();
                formError.textContent = '';
                // set default date? none
            }

            /** Update navigation active state */
            function setActiveTab(tab) {
                activeTab = tab;
                navBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                renderContent();
            }

            /** Render content based on active tab */
            function renderContent() {
                if (!character) return;

                let html = '';

                if (activeTab === 'home') {
                    html = renderHomeTab();
                } else if (activeTab === 'profile') {
                    html = renderProfileTab();
                } else if (activeTab === 'history') {
                    html = renderHistoryTab();
                }

                contentArea.innerHTML = html;
                // Attach event listener to the Age Up button if present
                const ageUpBtn = document.getElementById('ageUpBtn');
                if (ageUpBtn) {
                    ageUpBtn.addEventListener('click', handleAgeUp);
                }
            }

            /** Home tab: character overview + Age Up button */
            function renderHomeTab() {
                const stage = character.lifeStage;
                return `
                    <div class="panel">
                        <div class="panel-header">
                            <h2>${fullName(character)}</h2>
                            <span class="life-stage-badge">${stage}</span>
                        </div>
                        <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;">
                            <span class="age-display">${character.age} years</span>
                            <span class="text-muted">· ${character.gender} · ${character.city}, ${character.country}</span>
                        </div>
                        <div class="char-summary">
                            <div class="char-summary-item"><span class="label-icon">🎂</span> <strong>Born:</strong> ${formatBirthday(character.dob)}</div>
                        </div>
                        <div class="btn-row" style="margin-top: 24px;">
                            <button class="primary-btn" id="ageUpBtn">⏳ Age Up +1 year</button>
                        </div>
                    </div>
                `;
            }

            /** Profile tab: detailed character info */
            function renderProfileTab() {
                return `
                    <div class="panel">
                        <div class="panel-header">
                            <h2>Character Profile</h2>
                        </div>
                        <div class="profile-grid">
                            <div class="profile-field">
                                <div class="field-label">Full name</div>
                                <div class="field-value">${fullName(character)}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">Age</div>
                                <div class="field-value">${character.age}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">Gender</div>
                                <div class="field-value">${character.gender}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">Birthday</div>
                                <div class="field-value">${formatBirthday(character.dob)}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">Country</div>
                                <div class="field-value">${character.country}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">City</div>
                                <div class="field-value">${character.city}</div>
                            </div>
                            <div class="profile-field">
                                <div class="field-label">Life stage</div>
                                <div class="field-value">${character.lifeStage}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            /** Life History tab: timeline entries (newest first) */
            function renderHistoryTab() {
                // timeline is stored oldest first; we reverse for display
                const entries = [...character.timeline].reverse();
                const listHtml = entries.map(entry => `
                    <div class="timeline-entry">
                        <div class="timeline-age">Age ${entry.age}</div>
                        <div class="timeline-text">${entry.text}</div>
                    </div>
                `).join('');

                return `
                    <div class="panel">
                        <div class="panel-header">
                            <h2>Life Timeline</h2>
                            <span class="text-muted">newest first</span>
                        </div>
                        <div class="timeline-list">
                            ${listHtml || '<div class="text-muted">No entries yet.</div>'}
                        </div>
                    </div>
                `;
            }

            // ============================================================
            // 6. AGING SYSTEM
            // ============================================================

            function handleAgeUp() {
                if (!character) return;

                // Increment age
                const newAge = character.age + 1;
                character.age = newAge;
                character.lifeStage = getLifeStage(newAge);

                // Add timeline entry
                const newEntry = createTimelineEntry(newAge, character.firstName);
                character.timeline.push(newEntry);

                // Save & re-render
                saveCharacter();
                renderContent();

                // Optional: subtle notification (no UI clutter, just re-render)
            }

            // ============================================================
            // 7. NAVIGATION & EVENT LISTENERS
            // ============================================================

            // Tab buttons
            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setActiveTab(btn.dataset.tab);
                });
            });

            // New Life button (with confirmation)
            newLifeBtn.addEventListener('click', () => {
                if (character) {
                    const confirm = window.confirm(
                        '⚠️ Start a new life?\n\nYour current character and all progress will be permanently deleted.'
                    );
                    if (!confirm) return;
                }
                // Clear existing character
                clearCharacter();
                showCreateScreen();
            });

            // Create form submission
            createForm.addEventListener('submit', (e) => {
                e.preventDefault();
                formError.textContent = '';

                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const gender = document.getElementById('gender').value;
                const country = document.getElementById('country').value.trim();
                const city = document.getElementById('city').value.trim();
                const dob = document.getElementById('dob').value;

                // Validation
                if (!firstName || !lastName || !gender || !country || !city || !dob) {
                    formError.textContent = 'Please fill in all fields.';
                    return;
                }

                // Build new character
                const newChar = createNewCharacter({
                    firstName, lastName, gender, country, city, dob
                });

                // Save and set as current
                character = newChar;
                saveCharacter();

                // Switch to main screen and default tab 'home'
                showMainScreen();
                setActiveTab('home');
            });

            // ============================================================
            // 8. INITIALIZATION
            // ============================================================

            function init() {
                // Try to load saved character
                const saved = loadCharacter();
                if (saved) {
                    character = saved;
                    // Ensure lifeStage and timeline are consistent (safety)
                    if (!character.lifeStage) character.lifeStage = getLifeStage(character.age);
                    if (!character.timeline) character.timeline = [];
                    // Always ensure age0 exists
                    if (character.timeline.length === 0) {
                        character.timeline.push(createTimelineEntry(0, character.firstName));
                    }
                    // Ensure lifeStage is up-to-date
                    character.lifeStage = getLifeStage(character.age);

                    showMainScreen();
                    setActiveTab('home');
                } else {
                    // No character: show creation screen
                    showCreateScreen();
                }
            }

            // Start the game
            init();

        })();
    </script>
</body>
</html>
