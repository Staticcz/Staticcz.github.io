<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static's Hooper Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff6b35, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffd166;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #ddd;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      background: #1e3a8a;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      min-width: 180px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-save {
      background: #6d28d9;
    }

    .btn-save.selected {
      background: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    .btn-highschool {
      background: #e67e22;
    }

    .btn-college {
      background: #2980b9;
    }

    .btn-back {
      background: #555;
      margin-top: 20px;
      min-width: auto;
      padding: 10px 20px;
      font-size: 0.9rem;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 0.9rem;
      min-width: auto;
      background: #444;
    }

    .hidden {
      display: none;
    }

    .path-options {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .selected-save-info {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
      color: #ffd166;
    }

    /* Character Creation Form Styles */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffd166;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
    }

    .form-group select option {
      background: #1a1a2e;
      color: #fff;
    }

    .row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .row .form-group {
      flex: 1;
    }

    .build-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .build-option {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }

    .build-option.selected {
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.2);
      color: #ffd166;
    }

    .build-option input {
      display: none;
    }

    .validation-error {
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* Team Selection */
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
    }

    .team-card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 15px 20px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 150px;
      text-align: center;
    }

    .team-card:hover {
      background: rgba(255, 209, 102, 0.2);
      border-color: #ffd166;
      transform: translateY(-2px);
    }

    .team-card h3 {
      margin-bottom: 5px;
      font-size: 1.1rem;
    }

    .team-card p {
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 0;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .checkbox-label input {
      width: auto;
      margin: 0;
    }

    /* Career Hub */
    .player-summary {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .player-summary h3 {
      color: #ffd166;
      margin-bottom: 10px;
    }

    .player-summary .stat-line {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .player-summary .stat {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      min-width: 80px;
    }

    .player-summary .stat span {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
    }

    .player-summary .stat strong {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <!-- MAIN MENU SCREEN -->
  <div id="main-menu" class="screen active">
    <h1>Static's Hooper Generator</h1>
    <p>Choose a save file to begin your basketball journey</p>

    <div class="button-group">
      <button class="btn btn-save" data-save="1">Save 1</button>
      <button class="btn btn-save" data-save="2">Save 2</button>
      <button class="btn btn-save" data-save="3">Save 3</button>
    </div>

    <div id="selected-save-info" class="selected-save-info hidden"></div>

    <div id="path-options" class="path-options hidden">
      <h2>Choose Your Starting Path</h2>
      <div class="button-group">
        <button class="btn btn-highschool" id="start-highschool">High School</button>
        <button class="btn btn-college" id="start-college">College</button>
      </div>
    </div>
  </div>

  <!-- CHARACTER CREATION SCREEN -->
  <div id="character-creation" class="screen">
    <h2>Create Your Player</h2>
    <p>Fill in the details to build your future hooper.</p>

    <div class="row">
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" placeholder="Enter first name">
      </div>
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" placeholder="Enter last name">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Height</label>
        <div style="display: flex; gap: 10px;">
          <select id="height-feet" style="flex: 1;">
            <option value="5">5'</option>
            <option value="6">6'</option>
            <option value="7">7'</option>
          </select>
          <select id="height-inches" style="flex: 1;">
            <option value="0">0"</option>
            <option value="1">1"</option>
            <option value="2">2"</option>
            <option value="3">3"</option>
            <option value="4">4"</option>
            <option value="5">5"</option>
            <option value="6">6"</option>
            <option value="7">7"</option>
            <option value="8">8"</option>
            <option value="9">9"</option>
            <option value="10">10"</option>
            <option value="11">11"</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="weight">Weight (lbs)</label>
        <input type="number" id="weight" min="140" max="300" value="180">
      </div>
      <div class="form-group">
        <label for="wingspan">Wingspan (inches)</label>
        <input type="number" id="wingspan" min="60" max="90" value="72">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="position">Position</label>
        <select id="position">
          <option value="PG">PG</option>
          <option value="SG">SG</option>
          <option value="SF">SF</option>
          <option value="PF">PF</option>
          <option value="C">C</option>
          <option value="PG/SG">PG/SG</option>
          <option value="SG/SF">SG/SF</option>
          <option value="PF/C">PF/C</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Select Your Build(s) (up to 2)</label>
      <div class="build-options" id="build-options">
        <div class="build-option" data-build="Slasher">Slasher</div>
        <div class="build-option" data-build="Sharpshooter">Sharpshooter</div>
        <div class="build-option" data-build="Playmaker">Playmaker</div>
        <div class="build-option" data-build="Defender">Defender</div>
        <div class="build-option" data-build="Rebounder">Rebounder</div>
        <div class="build-option" data-build="Athletic">Athletic</div>
        <div class="build-option" data-build="Post Scorer">Post Scorer</div>
        <div class="build-option" data-build="Shot Creator">Shot Creator</div>
      </div>
      <div class="validation-error" id="build-error"></div>
    </div>

    <div class="button-group">
      <button class="btn btn-small" id="randomize-player">Randomize</button>
      <button class="btn" id="create-player">Create Player</button>
    </div>
    <button class="btn btn-back" id="back-to-menu">Back to Main Menu</button>
  </div>

  <!-- TEAM SELECTION SCREEN -->
  <div id="team-selection" class="screen">
    <h2>Select Your Team</h2>
    <p id="team-selection-subtitle"></p>

    <div id="aau-checkbox-container" class="hidden">
      <label class="checkbox-label">
        <input type="checkbox" id="aau-only-checkbox">
        AAU Only
      </label>
    </div>

    <div id="team-grid" class="team-grid"></div>

    <button class="btn btn-back" id="back-to-character">Back</button>
  </div>

  <!-- CAREER HUB PLACEHOLDER -->
  <div id="career-hub" class="screen">
    <h2>Career Hub</h2>
    <div class="player-summary" id="player-summary"></div>

    <div class="button-group">
      <button class="btn" id="play-btn">Play</button>
      <button class="btn" id="team-btn">Team</button>
      <button class="btn" id="rosters-btn">Rosters</button>
      <button class="btn btn-back" id="retire-btn" style="background:#8b0000;">Retire</button>
    </div>
    <button class="btn btn-back" id="back-to-team-selection">Back</button>
  </div>

  <script>
    // ---------- TEAM DATA ----------
    const highSchoolTeams = [

    const aauTeams = [
      { name: "Team Takeover", region: "DC" },
      { name: "Expressions Elite", region: "MA" },
      { name: "MoKan Elite", region: "MO" },
      { name: "Mac Irvin Fire", region: "IL" },

      { name: "Team WhyNot", region: "CA" },
      { name: "NY Renaissance", region: "NY" },
      { name: "PSA Cardinals", region: "NY" },
      { name: "Team Final", region: "PA" },
      { name: "Boo Williams", region: "VA" },
      { name: "E1T1", region: "FL" },
      { name: "Nightrydas Elite", region: "FL" },
      { name: "Vegas Elite", region: "NV" },
      { name: "Indy Heat", region: "IN" },
      { name: "All Ohio Red", region: "OH" },
      { name: "MeanStreets", region: "IL" },
      { name: "Bradley Beal Elite", region: "MO" }
    ];

    const collegeTeams = [
      { name: "Duke", conference: "ACC" },
      { name: "Kentucky", conference: "SEC" },
      { name: "North Carolina", conference: "ACC" },
      { name: "Kansas", conference: "Big 12" },
      { name: "UCLA", conference: "Pac-12" },
      { name: "Gonzaga", conference: "WCC" },
      { name: "Michigan State", conference: "Big Ten" },
      { name: "Villanova", conference: "Big East" },
      { name: "Arizona", conference: "Pac-12" },
      { name: "Baylor", conference: "Big 12" },
      { name: "Houston", conference: "Big 12" },
      { name: "Illinois", conference: "Big Ten" },
      { name: "Indiana", conference: "Big Ten" },
      { name: "Ohio State", conference: "Big Ten" },
      { name: "Texas", conference: "Big 12" },
      { name: "Alabama", conference: "SEC" },
      { name: "Tennessee", conference: "SEC" },
      { name: "Florida", conference: "SEC" },
      { name: "Auburn", conference: "SEC" },
      { name: "Arkansas", conference: "SEC" },
      { name: "Creighton", conference: "Big East" },
      { name: "Xavier", conference: "Big East" },
      { name: "San Diego State", conference: "Mountain West" },
      { name: "Miami", conference: "ACC" },
      { name: "Virginia", conference: "ACC" },
      { name: "Wisconsin", conference: "Big Ten" },
      { name: "Purdue", conference: "Big Ten" },
      { name: "Marquette", conference: "Big East" },
      { name: "Iowa State", conference: "Big 12" },
      { name: "Texas Tech", conference: "Big 12" }
    ];

    // ---------- GAME STATE ----------
    const state = {
      currentSaveSlot: null,
      currentPath: null,
      player: null
    };

    // ---------- DOM ELEMENTS ----------
    const mainMenuScreen = document.getElementById('main-menu');
    const characterCreationScreen = document.getElementById('character-creation');
    const teamSelectionScreen = document.getElementById('team-selection');
    const careerHubScreen = document.getElementById('career-hub');
    const saveButtons = document.querySelectorAll('.btn-save');
    const selectedSaveInfo = document.getElementById('selected-save-info');
    const pathOptions = document.getElementById('path-options');
    const startHighschoolBtn = document.getElementById('start-highschool');
    const startCollegeBtn = document.getElementById('start-college');
    const backToMenuBtn = document.getElementById('back-to-menu');
    const backToCharacterBtn = document.getElementById('back-to-character');
    const backToTeamSelectionBtn = document.getElementById('back-to-team-selection');
    const createPlayerBtn = document.getElementById('create-player');
    const randomizePlayerBtn = document.getElementById('randomize-player');
    const buildOptionsContainer = document.getElementById('build-options');
    const buildError = document.getElementById('build-error');
    const aauCheckboxContainer = document.getElementById('aau-checkbox-container');
    const aauOnlyCheckbox = document.getElementById('aau-only-checkbox');
    const teamGrid = document.getElementById('team-grid');
    const teamSelectionSubtitle = document.getElementById('team-selection-subtitle');
    const playerSummaryDiv = document.getElementById('player-summary');

    // ---------- SCREEN NAVIGATION ----------
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    // ---------- SAVE FILE SELECTION ----------
    saveButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        state.currentSaveSlot = parseInt(this.dataset.save);
        saveButtons.forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        selectedSaveInfo.textContent = `Selected Save File: ${state.currentSaveSlot}`;
        selectedSaveInfo.classList.remove('hidden');
        pathOptions.classList.remove('hidden');
      });
    });

    // ---------- START PATH SELECTION ----------
    startHighschoolBtn.addEventListener('click', function() {
      state.currentPath = 'highschool';
      showScreen('character-creation');
    });

    startCollegeBtn.addEventListener('click', function() {
      state.currentPath = 'college';
      showScreen('character-creation');
    });

    // ---------- BUILD SELECTION ----------
    const selectedBuilds = new Set();

    buildOptionsContainer.addEventListener('click', function(e) {
      const buildOption = e.target.closest('.build-option');
      if (!buildOption) return;
      const buildName = buildOption.dataset.build;
      
      if (selectedBuilds.has(buildName)) {
        selectedBuilds.delete(buildName);
        buildOption.classList.remove('selected');
      } else {
        if (selectedBuilds.size >= 2) {
          buildError.textContent = 'You can select up to 2 builds.';
          return;
        }
        selectedBuilds.add(buildName);
        buildOption.classList.add('selected');
        buildError.textContent = '';
      }
    });

    // ---------- RANDOMIZE PLAYER ----------
    function randomizePlayer() {
      const firstNames = ['Jay', 'Mike', 'Chris', 'Tyler', 'Darius', 'Kobe', 'LeBron', 'Zion', 'Cam', 'Jalen'];
      const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Davis', 'Miller', 'Wilson', 'Moore', 'Taylor'];
      document.getElementById('first-name').value = firstNames[Math.floor(Math.random() * firstNames.length)];
      document.getElementById('last-name').value = lastNames[Math.floor(Math.random() * lastNames.length)];
      
      const feet = [5,6,7][Math.floor(Math.random()*3)];
      const inches = Math.floor(Math.random()*12);
      document.getElementById('height-feet').value = feet;
      document.getElementById('height-inches').value = inches;
      
      const totalInches = feet*12 + inches;
      const baseWeight = Math.max(140, Math.min(300, Math.round(totalInches * 2.3 + 20)));
      document.getElementById('weight').value = baseWeight;
      
      document.getElementById('wingspan').value = Math.floor(Math.random()*31) + 60;
      
      const positions = ['PG','SG','SF','PF','C','PG/SG','SG/SF','PF/C'];
      document.getElementById('position').value = positions[Math.floor(Math.random()*positions.length)];
      
      selectedBuilds.clear();
      document.querySelectorAll('.build-option').forEach(opt => opt.classList.remove('selected'));
      buildError.textContent = '';
      
      const buildNames = ['Slasher','Sharpshooter','Playmaker','Defender','Rebounder','Athletic','Post Scorer','Shot Creator'];
      const numBuilds = Math.random() < 0.5 ? 1 : 2;
      const randomBuilds = [];
      while (randomBuilds.length < numBuilds) {
        const b = buildNames[Math.floor(Math.random()*buildNames.length)];
        if (!randomBuilds.includes(b)) randomBuilds.push(b);
      }
      randomBuilds.forEach(b => {
        selectedBuilds.add(b);
        document.querySelector(`.build-option[data-build="${b}"]`).classList.add('selected');
      });
    }

    randomizePlayerBtn.addEventListener('click', randomizePlayer);

    // ---------- PLAYER ATTRIBUTE GENERATION ----------
    function generatePlayer(data) {
      const potential = Math.floor(Math.random() * 99) + 1;
      let overall;
      if (potential <= 20) overall = 58 + Math.floor(Math.random() * 6);
      else if (potential <= 40) overall = 62 + Math.floor(Math.random() * 7);
      else if (potential <= 60) overall = 66 + Math.floor(Math.random() * 7);
      else if (potential <= 80) overall = 70 + Math.floor(Math.random() * 7);
      else overall = 74 + Math.floor(Math.random() * 7);

      const templates = {
        'PG':  { inside: 55, mid: 70, three: 75, play: 80, rebound: 40, per_def: 70, int_def: 40, ath: 70, iq: 75 },
        'SG':  { inside: 60, mid: 75, three: 80, play: 70, rebound: 40, per_def: 70, int_def: 40, ath: 75, iq: 70 },
        'SF':  { inside: 65, mid: 70, three: 70, play: 60, rebound: 55, per_def: 65, int_def: 50, ath: 70, iq: 65 },
        'PF':  { inside: 70, mid: 60, three: 55, play: 50, rebound: 75, per_def: 50, int_def: 65, ath: 65, iq: 60 },
        'C':   { inside: 75, mid: 50, three: 40, play: 45, rebound: 80, per_def: 40, int_def: 75, ath: 60, iq: 60 },
        'PG/SG':{ inside: 57, mid: 72, three: 77, play: 75, rebound: 40, per_def: 70, int_def: 40, ath: 72, iq: 72 },
        'SG/SF':{ inside: 62, mid: 72, three: 75, play: 65, rebound: 47, per_def: 67, int_def: 45, ath: 72, iq: 67 },
        'PF/C': { inside: 72, mid: 55, three: 47, play: 47, rebound: 77, per_def: 45, int_def: 70, ath: 62, iq: 60 }
      };

      let baseSkills = {};
      const pos = data.position;
      if (pos.includes('/')) {
        const [pos1, pos2] = pos.split('/');
        const t1 = templates[pos1];
        const t2 = templates[pos2];
        for (const key in t1) {
          baseSkills[key] = Math.round((t1[key] + t2[key]) / 2);
        }
      } else {
        baseSkills = { ...templates[pos] };
      }

      const buildModifiers = {
        'Slasher':       { inside: 8, mid: -2, three: -4, play: 0, rebound: 0, per_def: 0, int_def: 0, ath: 6, iq: -2 },
        'Sharpshooter':  { inside: -4, mid: 8, three: 10, play: -2, rebound: -2, per_def: 0, int_def: -2, ath: 0, iq: 2 },
        'Playmaker':     { inside: -2, mid: 0, three: 0, play: 10, rebound: -2, per_def: 0, int_def: -2, ath: 2, iq: 6 },
        'Defender':      { inside: -2, mid: -2, three: -4, play: -2, rebound: 2, per_def: 8, int_def: 8, ath: 4, iq: 4 },
        'Rebounder':     { inside: 2, mid: -4, three: -6, play: -2, rebound: 12, per_def: 0, int_def: 4, ath: 2, iq: -2 },
        'Athletic':      { inside: 2, mid: -2, three: -2, play: 0, rebound: 2, per_def: 2, int_def: 0, ath: 12, iq: -2 },
        'Post Scorer':   { inside: 10, mid: 4, three: -6, play: -2, rebound: 2, per_def: -2, int_def: 2, ath: 0, iq: 0 },
        'Shot Creator':  { inside: 0, mid: 8, three: 2, play: 4, rebound: -4, per_def: 0, int_def: -2, ath: 2, iq: 2 }
      };

      for (const build of data.builds) {
        const mod = buildModifiers[build];
        if (mod) {
          for (const key in mod) {
            baseSkills[key] += mod[key];
          }
        }
      }

      const totalInches = data.heightFeet * 12 + data.heightInches;
      if (totalInches >= 78) {
        baseSkills.rebound += 5;
        baseSkills.int_def += 5;
        baseSkills.ath -= 3;
        baseSkills.per_def -= 2;
      } else if (totalInches <= 73) {
        baseSkills.per_def += 3;
        baseSkills.ath += 3;
        baseSkills.rebound -= 3;
        baseSkills.int_def -= 3;
      }
      if (data.wingspan > totalInches + 4) {
        baseSkills.rebound += 3;
        baseSkills.int_def += 3;
        baseSkills.per_def += 2;
      } else if (data.wingspan < totalInches - 2) {
        baseSkills.ath += 2;
        baseSkills.per_def += 1;
      }

      for (const key in baseSkills) {
        baseSkills[key] = Math.max(40, Math.min(99, baseSkills[key]));
      }

      const targetOverall = overall;
      const baseOverall = 70;
      const scaleFactor = (targetOverall - 40) / (baseOverall - 40);
      const finalSkills = {};
      for (const key in baseSkills) {
        let val = 40 + (baseSkills[key] - 40) * scaleFactor;
        val += Math.floor(Math.random() * 5) - 2;
        val = Math.max(40, Math.min(99, Math.round(val)));
        finalSkills[key] = val;
      }

      const skillValues = Object.values(finalSkills);
      const avg = skillValues.reduce((a,b) => a+b, 0) / skillValues.length;
      const finalOverall = Math.round(avg);

      return {
        firstName: data.firstName,
        lastName: data.lastName,
        heightFeet: data.heightFeet,
        heightInches: data.heightInches,
        weight: data.weight,
        wingspan: data.wingspan,
        position: data.position,
        builds: [...data.builds],
        potential: potential,
        overall: finalOverall,
        skills: finalSkills,
        seasonStats: {
          gamesPlayed: 0,
          points: 0,
          assists: 0,
          rebounds: 0,
          steals: 0,
          blocks: 0,
          turnovers: 0,
          minutes: 0
        },
        careerStats: {},
        relationships: {
          coach: 50,
          teammates: 50,
          gm: 50
        },
        currentTeam: null,
        season: 1,
        age: state.currentPath === 'highschool' ? 14 : 18,
      };
    }

    // ---------- CREATE PLAYER ----------
    createPlayerBtn.addEventListener('click', function() {
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const heightFeet = parseInt(document.getElementById('height-feet').value);
      const heightInches = parseInt(document.getElementById('height-inches').value);
      const weight = parseInt(document.getElementById('weight').value);
      const wingspan = parseInt(document.getElementById('wingspan').value);
      const position = document.getElementById('position').value;

      if (!firstName || !lastName) {
        alert('Please enter both first and last name.');
        return;
      }
      if (isNaN(weight) || weight < 140 || weight > 300) {
        alert('Weight must be between 140 and 300 lbs.');
        return;
      }
      if (isNaN(wingspan) || wingspan < 60 || wingspan > 90) {
        alert('Wingspan must be between 60 and 90 inches.');
        return;
      }
      if (selectedBuilds.size === 0) {
        buildError.textContent = 'Please select at least one build.';
        return;
      }

      const playerData = {
        firstName,
        lastName,
        heightFeet,
        heightInches,
        weight,
        wingspan,
        position,
        builds: [...selectedBuilds]
      };

      state.player = generatePlayer(playerData);
      console.log('Player created:', state.player);

      // Prepare team selection screen
      prepareTeamSelection();
      showScreen('team-selection');
    });

    // ---------- TEAM SELECTION ----------
    function prepareTeamSelection() {
      const isHighSchool = state.currentPath === 'highschool';
      aauCheckboxContainer.classList.toggle('hidden', !isHighSchool);
      aauOnlyCheckbox.checked = false;
      updateTeamGrid();
    }

    function updateTeamGrid() {
      const isHighSchool = state.currentPath === 'highschool';
      const showAAU = isHighSchool && aauOnlyCheckbox.checked;
      let teams = [];
      if (isHighSchool) {
        teams = showAAU ? aauTeams : highSchoolTeams;
        teamSelectionSubtitle.textContent = showAAU ? 'AAU Teams' : 'High School Teams';
      } else {
        teams = collegeTeams;
        teamSelectionSubtitle.textContent = 'College Teams';
      }

      teamGrid.innerHTML = '';
      teams.forEach(team => {
        const card = document.createElement('div');
        card.className = 'team-card';
        const detail = team.state ? team.state : team.region ? team.region : team.conference;
        card.innerHTML = `<h3>${team.name}</h3><p>${detail}</p>`;
        card.addEventListener('click', () => selectTeam(team));
        teamGrid.appendChild(card);
      });
    }

    aauOnlyCheckbox.addEventListener('change', updateTeamGrid);

    function selectTeam(team) {
      state.player.currentTeam = team;
      console.log('Team selected:', team);
      showCareerHub();
    }

    // ---------- CAREER HUB ----------
    function showCareerHub() {
      // Update player summary
      const p = state.player;
      const stats = p.seasonStats;
      const avgPoints = stats.gamesPlayed ? (stats.points / stats.gamesPlayed).toFixed(1) : '0.0';
      const avgAssists = stats.gamesPlayed ? (stats.assists / stats.gamesPlayed).toFixed(1) : '0.0';
      const avgRebounds = stats.gamesPlayed ? (stats.rebounds / stats.gamesPlayed).toFixed(1) : '0.0';

      playerSummaryDiv.innerHTML = `
        <h3>${p.firstName} ${p.lastName}</h3>
        <p>${p.position} | ${p.heightFeet}'${p.heightInches}" | ${p.weight} lbs | Overall: ${p.overall}</p>
        <p>Team: ${p.currentTeam.name}</p>
        <div class="stat-line">
          <div class="stat"><span>PPG</span><strong>${avgPoints}</strong></div>
          <div class="stat"><span>APG</span><strong>${avgAssists}</strong></div>
          <div class="stat"><span>RPG</span><strong>${avgRebounds}</strong></div>
        </div>
      `;

      showScreen('career-hub');
    }

    // ---------- CAREER HUB BUTTONS ----------
    document.getElementById('play-btn').addEventListener('click', () => alert('Play feature coming soon!'));
    document.getElementById('team-btn').addEventListener('click', () => alert('Team feature coming soon!'));
    document.getElementById('rosters-btn').addEventListener('click', () => alert('Rosters feature coming soon!'));
    document.getElementById('retire-btn').addEventListener('click', () => {
      if (confirm('Are you sure you want to retire this player?')) {
        alert('Retirement screen coming soon!');
        // Future: show retirement summary
      }
    });

    // ---------- NAVIGATION ----------
    backToMenuBtn.addEventListener('click', () => showScreen('main-menu'));
    backToCharacterBtn.addEventListener('click', () => showScreen('character-creation'));
    backToTeamSelectionBtn.addEventListener('click', () => showScreen('team-selection'));

    console.log('Game initialized.');
  </script>
</body>
</html>
